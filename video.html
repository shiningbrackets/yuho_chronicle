<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>유호 · 성장 영상</title>
    <meta name="description" content="유호의 첫 생일을 맞아 준비한 성장 영상입니다." />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/CormorantGaramond-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Pretendard-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <main id="main" class="page">
      <section class="video-page" aria-labelledby="video-title">
        <div class="video-page__inner">
          <h1 id="video-title" class="video-page__title">유호 성장 영상</h1>
          <p class="video-page__sub">2025.08.17 — 태어나서 첫 생일까지</p>

          <div class="video-page__player" id="playerWrap">
            <video
              id="releaseVideo"
              class="video-page__video"
              controls
              playsinline
              preload="metadata"
              poster="./images/yuho/hero2-poster.webp"
              crossorigin="anonymous"
            ></video>
            <div id="videoStatus" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.45);color:#fff;font-size:14px">불러오는 중…</div>
          </div>
          <p style="margin-top:10px;text-align:center">
            <a href="https://github.com/shiningbrackets/yuho_chronicle/releases" target="_blank" rel="noopener" style="color:var(--muted);font-size:13px;text-decoration:underline">GitHub Releases에서 직접 열기</a>
          </p>
        </div>
      </section>

      <footer class="footer">
        <a class="footer__back" href="./index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          돌아가기
        </a>
        <p>유호 · Growth Video · 2026</p>
      </footer>
    </main>

    <script>
      (function () {
        var video = document.getElementById("releaseVideo");
        var status = document.getElementById("videoStatus");
        // GitHub Releases 자산 URL — 업로드 후 실제 URL로 교체
        // 예: https://github.com/shiningbrackets/yuho_chronicle/releases/download/v1.0-video/yuho-growth.mp4
        // 또는 1080p 원본: .../yuho-growth-1080p.mp4
        var RELEASE_MP4 = "https://github.com/shiningbrackets/yuho_chronicle/releases/download/v1.0-video/full-yuho-growth.mp4";
        var FALLBACK_MP4 = "./videos/yuho-growth.mp4";

        // ?r= 로 테스트 URL 주입: video.html?r=https://.../video.mp4
        var m = location.search.match(/[?&]r=([^&]+)/);
        if (m) RELEASE_MP4 = decodeURIComponent(m[1]);

        // ?d= 로 Drive ID 테스트 (기존 호환)
        var dm = location.search.match(/[?&]d=([^&]+)/);
        if (dm) {
          var id = decodeURIComponent(dm[1]);
          if (/^[A-Za-z0-9_-]{20,}$/.test(id)) {
            RELEASE_MP4 = "https://drive.google.com/uc?export=download&id=" + id;
          }
        }

        function useFallback() {
          video.src = FALLBACK_MP4;
          video.load();
          if (status) status.style.display = "none";
        }

        // Releases URL이 아직 없으면 로컬 폴백
        if (RELEASE_MP4.indexOf("REPLACE") !== -1) {
          useFallback();
          return;
        }

        video.src = RELEASE_MP4;
        video.addEventListener("loadeddata", function () { if (status) status.style.display = "none"; });
        video.addEventListener("error", function () {
          // CORS/404 시 로컬 폴백
          useFallback();
          if (status) {
            status.textContent = "Releases 로드 실패 — 로컬 영상으로 전환";
            setTimeout(function(){ if(status) status.style.display="none"; }, 2000);
          }
        });
        video.load();
      })();
    </script>
  </body>
</html>
